}

:root[data-theme="dark"]{

.mock-cap b{color:var(--accent);font-weight:500}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.form .full{grid-column:1/-1}
.f{display:grid;gap:3px;min-width:0}
.f span{font-size:12px;color:var(--muted)}

.new{background:var(--accent-soft);border-radius:6px;padding:4px 6px;margin:-4px -6px}

.changed span::after{content:"  改";color:var(--chg);font-weight:700}

.caseno .val em{font-style:normal;color:var(--accent)}

.menu{background:var(--navy);color:var(--navy-ink);border-radius:8px;padding:8px;display:grid;gap:2px;font-size:13px;max-width:240px}
.menu div{padding:5px 10px;border-radius:5px;opacity:.85}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--mock)}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}

.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--chg-soft);color:var(--chg)}
.p-bad{background:var(--bad-soft);color:var(--bad)}

.hbar{width:90px;height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}

.dh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}

.note-s{font-size:12px;color:var(--muted)}

.final .btns{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navy-ink);padding:8px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.btn.send{font-size:16px;padding:10px 28px}
.btn:disabled{opacity:.6;cursor:default}
.sendmsg{border-radius:8px;padding:10px 12px;font-size:14px}
.sendmsg.ok{background:var(--ok-soft);color:var(--ok)}
.sendmsg.warn{background:var(--chg-soft);color:var(--chg)}
.sendmsg.bad{background:var(--bad-soft);color:var(--bad)}
.sendmsg .btns{margin-top:8px}
pre.out{white-space:pre-wrap;background:var(--mock);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;max-height:300px;overflow:auto}
@media (max-width:980px){.sec-body{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .toc{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}
  .toc .prog{grid-column:1/-1}
  .form{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">

<script>

  if(act==="ok"||act==="chg"){s.s=s.s===act?"":act;if(act==="chg"&&s.s)setTimeout(()=>document.getElementById("n_"+id).focus(),0)}
  else if(act==="edit"){document.getElementById("ed_"+id).hidden=false;document.getElementById("et_"+id).focus();return}

  else if(act==="saveEdit"){const v=document.getElementById("et_"+id).value.trim();const orig=ALL.find(x=>x.id===id).text;s.text=(v&&v!==orig)?v:"";if(s.text&&!s.s)s.s="chg"}
  else if(act==="undoEdit"){s.text=""}
  save(); const sy=scrollY; rerenderItem(id); scrollTo(0,sy); return}
 const f=e.target.closest("[data-f]"); if(f){advF=f.dataset.f;document.querySelectorAll("#advFilter .chip").forEach(b=>b.setAttribute("aria-pressed",b===f));renderAdvList();return}

 if(e.target.id==="send"||e.target.id==="sendAnyway"){send(e.target.id==="sendAnyway");return}
});

 const b=document.getElementById("send"); b.disabled=true; b.textContent="送出中…";
 let n=0;
 const payload={who:ST.who.trim(),final:ST.final||"",items:SECTIONS.flatMap(sec=>sec.items.map(([id,t])=>{n++;const s=it(id);return {no:n,sec:sec.title,text:t,edited:s.text||"",status:s.s==="ok"?"沒問題":s.s==="chg"?"要修改":"還沒看",note:s.note||""}}))};
 try{
  const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  const t=await r.text();
  if(!r.ok||t.trim()!=="ok") throw new Error(t);
  document.getElementById("sendFail").hidden=true;
  msg("ok",`已送出，謝謝！（${new Date().toLocaleString("zh-TW",{hour12:false})}）<br>之後想改，改完再按一次「送出」就好。`);
 }catch(err){
  msg("bad","送出沒有成功，可能是網路不穩。請稍後再按一次「送出」；還是不行的話，按下面的「複製回覆內容」，貼到 LINE 傳給我們。");
  document.getElementById("sendFail").hidden=false;
 }finally{b.disabled=false;b.textContent="送出"}
}
document.addEventListener("keydown",e=>{const r=e.target.closest&&e.target.closest("tr.click");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();r.click()}});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset.note){it(t.dataset.note).note=t.value;save();return}
 if(t.id==="who"){ST.who=t.value;save();return}
 if(t.id==="finalNote"){ST.final=t.value;save();return}
 if(t.id==="mk_no"){updOwner();return}
 if(t.id==="advQ"){advQ=t.value;const pos=t.selectionStart;renderAdvDetail();const n=document.getElementById("advQ");n.focus();n.setSelectionRange(pos,pos);return}
});
document.addEventListener("change",e=>{
 if(e.target.id==="mk_owner"){updOwner();return}
 if(e.target.id==="advPer"){advPer=+e.target.value;renderAdvDetail();return}
});
function rerenderItem(id){
 const old=document.getElementById("i_"+id); const sec=SECTIONS.find(s=>s.items.some(x=>x[0]===id));
 const no=ALL.findIndex(x=>x.id===id)+1; const txt=sec.items.find(x=>x[0]===id)[1];
 const tmp=document.createElement("div"); tmp.innerHTML=itemHtml(id,txt,no); old.replaceWith(tmp.firstElementChild); renderToc();
}
document.getElementById("who").value=ST.who;
render();
</script>
